<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.metaTitle">تسجيل الدخول — يلا كار</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>

<body class="auth-body">

    <button class="auth-lang-switch en" data-i18n="lang.switch">EN</button>

    <div class="auth-container">

        <div class="auth-form-side">

            <a href="../index.html" class="auth-logo">
                <span class="logo-first" data-i18n="logo.first">يلا</span>
                <span data-i18n="logo.second">كار</span>
            </a>

            <!-- ========== تبويبات: عميل / شركة ========== -->
            <div class="auth-role-tabs">
                <button type="button" class="auth-role-tab active" data-role="customer">
                    <span class="role-tab-icon">👤</span>
                    <span data-i18n="login.roleCustomer">عميل</span>
                </button>
                <button type="button" class="auth-role-tab" data-role="company">
                    <span class="role-tab-icon">🏢</span>
                    <span data-i18n="login.roleCompany">شركة</span>
                </button>
            </div>

            <!-- ========== نموذج العميل ========== -->
            <form class="auth-form active" id="customerForm" data-role="customer">

                <div class="auth-field">
                    <label for="customerEmail" data-i18n="login.email">البريد الإلكتروني</label>
                    <input id="customerEmail" type="email" placeholder="name@email.com" required>
                </div>

                <div class="auth-field">
                    <label for="customerPassword" data-i18n="login.password">كلمة المرور</label>
                    <input id="customerPassword" type="password" placeholder="••••••••" required>
                </div>

                <div class="auth-extras">
                    <label class="auth-checkbox">
                        <input type="checkbox">
                        <span data-i18n="login.remember">تذكرني</span>
                    </label>
                    <a href="#" class="auth-link" data-i18n="login.forgot">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="auth-submit" data-i18n="login.submit">تسجيل الدخول</button>

                <p class="auth-bottom-text">
                    <span data-i18n="login.noAccount">ما عندك حساب؟</span>
                    <a href="register.html" class="auth-link" data-i18n="login.createAccount">أنشئ حساب</a>
                </p>
            </form>

            <!-- ========== نموذج الشركة ========== -->
            <form class="auth-form" id="companyForm" data-role="company">

                <div class="auth-field">
                    <label for="companyEmail" data-i18n="login.email">البريد الإلكتروني</label>
                    <input id="companyEmail" type="email" placeholder="info@company.jo" required>
                </div>

                <div class="auth-field">
                    <label for="companyPassword" data-i18n="login.password">كلمة المرور</label>
                    <input id="companyPassword" type="password" placeholder="••••••••" required>
                </div>

                <div class="auth-extras">
                    <label class="auth-checkbox">
                        <input type="checkbox">
                        <span data-i18n="login.remember">تذكرني</span>
                    </label>
                    <a href="#" class="auth-link" data-i18n="login.forgot">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="auth-submit" data-i18n="login.companyLogin">دخول الشركات</button>

                <!-- رابط تسجيل شركة جديدة -->
                <div class="auth-register-company-box">
                    <p class="register-company-text">
                        <span data-i18n="login.newCompany">شركة جديدة؟</span>
                    </p>
                    <a href="register-company.html" class="auth-register-company-btn">
                        <span>🏢</span>
                        <span data-i18n="login.registerCompany">سجّل شركتك الآن</span>
                    </a>
                </div>
            </form>



        </div>

        <!-- ========== الجهة اليسرى: التصميم ========== -->
        <div class="auth-visual-side">

            <div class="auth-visual-content">
                <div class="auth-visual-logo">
                    <span data-i18n="logo.first">يلا</span>
                    <span class="visual-accent" data-i18n="logo.second">كار</span>
                </div>
                <p class="auth-visual-text" data-i18n="login.welcomeDesc">
                    استأجر سيارتك من أفضل الشركات الأردنية الموثوقة
                </p>
            </div>

            <div class="auth-car-svg">
                <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="80" y="60" width="240" height="55" rx="18" fill="#3B5BA9" />
                    <rect x="130" y="30" width="140" height="45" rx="15" fill="#3B5BA9" />
                    <circle cx="130" cy="120" r="22" fill="#1E2A4A" />
                    <circle cx="270" cy="120" r="22" fill="#1E2A4A" />
                </svg>
            </div>

        </div>
    </div>

    <!-- ========== Toast ========== -->
    <div class="auth-toast" id="authToast">
        <span class="auth-toast-ico">✓</span>
        <span id="authToastMsg"></span>
    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>

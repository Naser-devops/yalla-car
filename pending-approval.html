<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pending.metaTitle">طلبك قيد المراجعة — يلا كار</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pending-approval.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <main class="pending-page">
        <div class="pending-container">

            <!-- أيقونة النجاح -->
            <div class="pending-icon">
                <span>⏳</span>
            </div>

            <!-- العنوان -->
            <h1 class="pending-title" data-i18n="pending.title">طلبك قيد المراجعة</h1>

            <!-- النص -->
            <p class="pending-text" data-i18n="pending.text">
                شكراً لك على تسجيل شركتك في يلا كار. فريقنا سيراجع طلبك خلال 24-48 ساعة،
                وسيتم إشعارك عبر البريد الإلكتروني عند الموافقة.
            </p>

            <!-- الخطوات -->
            <div class="pending-steps">

                <div class="pending-step done">
                    <div class="step-circle">✓</div>
                    <span class="step-label" data-i18n="pending.step1">تم إرسال الطلب</span>
                </div>

                <div class="step-line"></div>

                <div class="pending-step active">
                    <div class="step-circle">2</div>
                    <span class="step-label" data-i18n="pending.step2">قيد المراجعة</span>
                </div>

                <div class="step-line"></div>

                <div class="pending-step">
                    <div class="step-circle">3</div>
                    <span class="step-label" data-i18n="pending.step3">الموافقة والدخول</span>
                </div>

            </div>

            <!-- معلومات -->
            <div class="pending-info">
                <div class="info-line">
                    <span class="info-icon">📧</span>
                    <span data-i18n="pending.infoEmail">تحقق من بريدك الإلكتروني باستمرار</span>
                </div>
                <div class="info-line">
                    <span class="info-icon">⏰</span>
                    <span data-i18n="pending.infoTime">المراجعة عادة تستغرق 24-48 ساعة</span>
                </div>
            </div>

            <!-- الأزرار -->
            <div class="pending-actions">
                <a href="index.html" class="btn-primary-pending" data-i18n="pending.home">العودة للرئيسية</a>
                <a href="contact.html" class="btn-secondary-pending" data-i18n="pending.contact">تواصل معنا</a>
            </div>

        </div>
    </main>
<script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
</body>

</html>

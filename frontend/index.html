<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yalla Car</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="logo">يلا <span>كار</span></div>
        <nav class="navigation">
            <a href="#" class="active">الرئيسية</a>
            <a href="#">السيارات</a>
            <a href="#">الشركات</a>
            <a href="#">كيف يعمل</a>
        </nav>
        <div class="action">
            <button class="en">EN</button>
            <button class="login-btn">تسجيل الدخول</button>
        </div>
    </header>


    <section class="hero">
        <div class="container">
            <h1 class="hero-title">استأجر سيارتك في الأردن بكل بسهولة</h1>
            <p class="hero-subtitle">سيارات من شركات تأجير أردنية موثوقة بأسعار واضحة</p>

            <form class="search-box">
                <div class="search-field">
                    <label for="pickup-city">مدينة الاستلام</label>
                    <input id="pickup-city" type="text" placeholder="عمان">
                </div>

                <div class="search-field">
                    <label for="pickup-date">تاريخ الاستلام</label>
                    <input id="pickup-date" type="date">
                </div>

                <div class="search-field">
                    <label for="return-date">تاريخ الإرجاع</label>
                    <input id="return-date" type="date">
                </div>


                <div class="search-field">
                    <label for="car-type">نوع السيارة</label>
                    <select id="car-type">
                        <option>الكل</option>
                        <option>اقتصادية</option>
                        <option>عائلية</option>
                        <option>SUV</option>
                        <option>فخمة</option>
                    </select>
                </div>
                <button type="submit" class="btn-search">بحث</button>
            </form>
        </div>
    </section>
</body>

</html>

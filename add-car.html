<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="addCar.metaTitle">إضافة سيارة — يلا كار</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/add-car.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <!-- ========== الهيدر (نسخة لوحة الشركة) ========== -->
    <header>
        <div class="logo">
            <span class="logo-first" data-i18n="logo.first">يلا</span>
            <span data-i18n="logo.second">كار</span>
        </div>

        <div class="action">
            <button class="en" data-i18n="lang.switch">EN</button>
            <a href="login.html" class="login-btn" data-i18n="auth.logout" data-logout>تسجيل الخروج</a>
        </div>
    </header>

    <!-- ========== لوحة التحكم ========== -->
    <div class="dashboard-layout container">

        <main class="dashboard-content">

            <div class="dashboard-header">
                <h1 class="dashboard-title" data-i18n="addCar.title">إضافة سيارة جديدة</h1>
                <a href="manage-cars.html" class="btn-outline" data-i18n="addCar.back">→ العودة للسيارات</a>
            </div>

            <form class="car-form" id="carForm">

                <div class="form-section">
                    <h2 class="form-section-title" data-i18n="addCar.section.basic">معلومات أساسية</h2>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="carName" data-i18n="addCar.field.carName">اسم السيارة</label>
                            <input id="carName" type="text" placeholder="Kia Picanto 2023" required>
                        </div>

                        <div class="form-field">
                            <label for="carBrand" data-i18n="addCar.field.brand">الماركة</label>
                            <select id="carBrand" required>
                                <option value="" disabled selected data-i18n="addCar.brand.select">اختر الماركة</option>
                                <option value="kia">Kia</option>
                                <option value="toyota">Toyota</option>
                                <option value="hyundai">Hyundai</option>
                                <option value="mercedes">Mercedes</option>
                                <option value="bmw">BMW</option>
                                <option value="nissan">Nissan</option>
                                <option value="other" data-i18n="addCar.brand.other">أخرى</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="carYear" data-i18n="addCar.field.year">سنة الصنع</label>
                            <input id="carYear" type="number" min="2000" max="2030" placeholder="2023" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title" data-i18n="addCar.section.details">التفاصيل</h2>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="carCategory" data-i18n="addCar.field.category">التصنيف</label>
                            <select id="carCategory" required>
                                <option value="" disabled selected data-i18n="addCar.category.select">اختر التصنيف</option>
                                <option value="economy" data-i18n="type.economy">اقتصادية</option>
                                <option value="family" data-i18n="type.family">عائلية</option>
                                <option value="suv" data-i18n="type.suv">SUV</option>
                                <option value="luxury" data-i18n="type.luxury">فخمة</option>
                                <option value="4x4" data-i18n="type.fourByFour">4x4</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="carSeats" data-i18n="addCar.field.seats">عدد المقاعد</label>
                            <input id="carSeats" type="number" min="2" max="9" placeholder="5" required>
                        </div>

                        <div class="form-field">
                            <label for="carPrice" data-i18n="addCar.field.price">السعر اليومي (د.أ)</label>
                            <input id="carPrice" type="number" min="10" max="500" placeholder="22" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="carTransmission" data-i18n="addCar.field.transmission">ناقل الحركة</label>
                            <select id="carTransmission" required>
                                <option value="automatic" selected data-i18n="carDetails.automatic">أوتوماتيك</option>
                                <option value="manual" data-i18n="addCar.transmission.manual">عادي</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="carFuel" data-i18n="addCar.field.fuel">الوقود</label>
                            <select id="carFuel" required>
                                <option value="petrol" selected data-i18n="carDetails.petrol">بنزين</option>
                                <option value="diesel" data-i18n="addCar.fuel.diesel">ديزل</option>
                                <option value="electric" data-i18n="addCar.fuel.electric">كهرباء</option>
                                <option value="hybrid" data-i18n="addCar.fuel.hybrid">هايبرد</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="carLocation" data-i18n="addCar.field.location">الموقع</label>
                            <select id="carLocation" required>
                                <option value="amman" selected data-i18n="booking.amman">عمّان</option>
                                <option value="aqaba" data-i18n="booking.aqaba">العقبة</option>
                                <option value="irbid" data-i18n="booking.irbid">إربد</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title" data-i18n="addCar.section.features">المميزات</h2>

                    <div class="features-checkboxes">
                        <label class="feature-check">
                            <input type="checkbox" name="features" value="ac">
                            <span data-i18n="carDetails.ac">تكييف</span>
                        </label>

                        <label class="feature-check">
                            <input type="checkbox" name="features" value="bluetooth">
                            <span data-i18n="carDetails.bluetooth">بلوتوث</span>
                        </label>

                        <label class="feature-check">
                            <input type="checkbox" name="features" value="gps">
                            <span data-i18n="carDetails.gps">نظام ملاحة GPS</span>
                        </label>

                        <label class="feature-check">
                            <input type="checkbox" name="features" value="usb">
                            <span data-i18n="carDetails.usb">منفذ USB</span>
                        </label>

                        <label class="feature-check">
                            <input type="checkbox" name="features" value="camera">
                            <span data-i18n="addCar.feature.camera">كاميرا خلفية</span>
                        </label>

                        <label class="feature-check">
                            <input type="checkbox" name="features" value="sunroof">
                            <span data-i18n="addCar.feature.sunroof">فتحة سقف</span>
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title" data-i18n="addCar.section.description">الوصف</h2>

                    <div class="form-field">
                        <label for="carDescription" data-i18n="addCar.field.description">وصف السيارة (اختياري)</label>
                        <textarea id="carDescription" rows="4" placeholder="مثال: سيارة اقتصادية ممتازة للتنقل داخل المدينة..."></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title" data-i18n="addCar.section.images">صور السيارة</h2>

                    <div class="images-upload">

                        <div class="image-upload-box">
                            <label class="upload-label">
                                <input type="file" accept="image/*" id="imageFront" class="upload-input">
                                <div class="upload-placeholder" id="placeholder1">
                                    <span class="upload-icon">📷</span>
                                    <span class="upload-text" data-i18n="addCar.image.front">الصورة الأمامية</span>
                                </div>
                                <img id="preview1" class="upload-preview" alt="preview">
                            </label>
                        </div>

                        <div class="image-upload-box">
                            <label class="upload-label">
                                <input type="file" accept="image/*" id="imageSide" class="upload-input">
                                <div class="upload-placeholder" id="placeholder2">
                                    <span class="upload-icon">📷</span>
                                    <span class="upload-text" data-i18n="addCar.image.side">الصورة الجانبية</span>
                                </div>
                                <img id="preview2" class="upload-preview" alt="preview">
                            </label>
                        </div>

                        <div class="image-upload-box">
                            <label class="upload-label">
                                <input type="file" accept="image/*" id="imageRear" class="upload-input">
                                <div class="upload-placeholder" id="placeholder3">
                                    <span class="upload-icon">📷</span>
                                    <span class="upload-text" data-i18n="addCar.image.rear">الصورة الخلفية</span>
                                </div>
                                <img id="preview3" class="upload-preview" alt="preview">
                            </label>
                        </div>

                    </div>
                </div>

                <div class="form-actions">
                    <a href="manage-cars.html" class="btn-outline" data-i18n="addCar.cancel">إلغاء</a>
                    <button type="submit" class="btn-save" data-i18n="addCar.save">حفظ السيارة</button>
                </div>

            </form>

        </main>

        <aside class="dashboard-sidebar">
            <div class="sidebar-logo">
                <span class="logo-first" data-i18n="logo.first">يلا</span>
                <span data-i18n="logo.second">كار</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">
                    <span data-i18n="dashboard.overview">لوحة التحكم</span>
                </a>
                <a href="manage-cars.html" class="sidebar-link active">
                    <span data-i18n="dashboard.cars">السيارات</span>
                </a>
                <a href="incoming-bookings.html" class="sidebar-link">
                    <span data-i18n="dashboard.bookings">الحجوزات</span>
                </a>
                <a href="earnings.html" class="sidebar-link">
                    <span data-i18n="dashboard.earnings">الأرباح</span>
                </a>
            </nav>

            <a href="index.html" class="sidebar-logout" data-i18n="dashboard.logout" data-logout>تسجيل الخروج</a>
        </aside>

    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© <span id="year"></span> <span data-i18n="footer.rights">يلا كار — جميع الحقوق محفوظة</span></p>
            </div>
        </div>
    </footer>
<script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/add-car.js"></script>
</body>

</html>
